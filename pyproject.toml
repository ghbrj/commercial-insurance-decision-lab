[project]
name = "commercial-insurance-decision-lab"
version = "0.1.0"
description = "Personal lab: decision models vs. rules baselines on synthetic commercial underwriting tasks"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",          # bootstrap CIs, exact binomial
    "statsmodels>=0.14",    # recoverability GLM check
    "httpx>=0.27",          # Jev API transport (add official SDK when pinned)
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
